[project]
name = "mapetitecoree-backend"
version = "0.1.0"
description = "API Django de la boutique Ma Petite Corée.ma"
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--reuse-db -ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "**/migrations/0001_*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "BLE", "SIM", "RUF"]
# RUF001-003 : caractères typographiques français (« », ×, ’) volontaires.
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
